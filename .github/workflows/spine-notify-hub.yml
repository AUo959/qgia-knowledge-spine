# spine-notify-hub.yml
# Manual / recovery dispatch of qgia.knowledge.updated to the constellation hub.
#
# CONNECTIVITY PASS 2026-08-19 — two defects fixed:
#
#  1. NON-CONFORMANT PAYLOAD (the link was dead, silently).
#     The previous client-payload was {sha, ref, actor, committed_at, spoke_tag,
#     contracts}. The hub's constellation-event-router.yml validates every
#     client_payload against constellation-contracts/schemas/constellation-event.schema.json,
#     which REQUIRES event_type, source_node, timestamp and payload. None of the
#     four were present, so validate-event failed on every push and the gated
#     route-event job never ran. .aurora/constellation.json has claimed
#     "closed_loop_stage": "dispatch-live" since 2026-06-08 while nothing routed.
#
#  2. DUPLICATE EMITTER.
#     constellation-knowledge-index.yml already emits a schema-conformant
#     qgia.knowledge.updated on pushes to main. This workflow fired on the same
#     event, so every qualifying push produced two hub dispatches. The push
#     trigger is removed here; constellation-knowledge-index.yml owns the
#     routine path and this workflow is the manual re-fire / recovery lever.
#
# Required secret (qgia-knowledge-spine → Settings → Secrets → Actions):
#   CONSTELLATION_TOKEN — PAT with repo scope on AUo959/aurora-cloudbank-symbolic

name: Spine → Hub Notify (manual)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual re-fire is being issued (recorded in the envelope)"
        required: false
        default: "manual re-fire"

permissions:
  contents: read

jobs:
  notify-hub:
    name: Dispatch qgia.knowledge.updated to constellation hub
    runs-on: ubuntu-latest
    steps:
      - name: Guard on missing CONSTELLATION_TOKEN
        env:
          HAS_TOKEN: ${{ secrets.CONSTELLATION_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CONSTELLATION_TOKEN is not set in this repository; the hub link cannot be exercised."
            exit 1
          fi

      - name: Fire repository_dispatch to aurora-cloudbank-symbolic
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.CONSTELLATION_TOKEN }}
          repository: AUo959/aurora-cloudbank-symbolic
          event-type: qgia.knowledge.updated
          client-payload: >-
            {
              "event_type": "qgia.knowledge.updated",
              "source_node": "QGIA-SPINE",
              "source_repo": "qgia-knowledge-spine",
              "timestamp": "${{ github.event.repository.updated_at }}",
              "correlation_id": "${{ github.run_id }}-${{ github.run_number }}",
              "hop": 0,
              "provenance": {
                "charter": "Picard_Delta_3",
                "l3_compliance": true
              },
              "payload": {
                "commit_sha": "${{ github.sha }}",
                "ref": "${{ github.ref }}",
                "actor": "${{ github.actor }}",
                "trigger": "manual",
                "reason": ${{ toJSON(inputs.reason) }},
                "spoke_tag": "s.tag::qgia.spine",
                "index_url": "https://raw.githubusercontent.com/AUo959/qgia-knowledge-spine/main/.aurora/knowledge-index.json",
                "contracts": [
                  "knowledge-index",
                  "forecast-ledger",
                  "prior-table",
                  "calibration-report",
                  "resolution-policy"
                ]
              }
            }

      - name: Log dispatch result
        if: always()
        run: |
          echo "::notice::Dispatched qgia.knowledge.updated to AUo959/aurora-cloudbank-symbolic (sha=${{ github.sha }}, actor=${{ github.actor }})"
