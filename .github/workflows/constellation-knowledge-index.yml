name: "QGIA Spine Knowledge Index Publisher"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.md'
      - '.aurora/constellation.json'
      - 'data/**'
      - 'policies/**'
      - 'scripts/*.py'
      - 'tests/**'

permissions:
  contents: write

jobs:
  generate-index:
    name: Generate & Publish Knowledge Index
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is required, not an optimisation to skip. The index
          # generator derives each document's `last_modified` from
          # `git log -1 --format=%cI -- <path>`. Under the default shallow
          # checkout only one commit exists, so every document resolves to the
          # same timestamp, that wrong index is validated and committed, and a
          # full-history clone then rejects it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate knowledge index
        run: python3 scripts/generate-knowledge-index.py

      - name: Validate knowledge contract
        run: python3 scripts/validate-knowledge-contract.py

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Commit updated index
        run: |
          git config user.name "aurora-constellation[bot]"
          git config user.email "aurora-constellation[bot]@users.noreply.github.com"
          git add .aurora/knowledge-index.json
          git diff --cached --quiet || git commit -m "chore: auto-update knowledge index [skip ci]"
          git push

      - name: Publish event to Constellation Hub
        if: success()
        uses: peter-evans/repository-dispatch@v3.0.0
        with:
          token: ${{ secrets.CONSTELLATION_TOKEN }}
          repository: AUo959/aurora-cloudbank-symbolic
          event-type: qgia.knowledge.updated
          client-payload: >-
            {
              "source_node": "QGIA-SPINE",
              "source_repo": "qgia-knowledge-spine",
              "event_type": "qgia.knowledge.updated",
              "correlation_id": "${{ github.run_id }}-${{ github.run_number }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}",
              "payload": {
                "commit_sha": "${{ github.sha }}",
                "index_url": "https://raw.githubusercontent.com/AUo959/qgia-knowledge-spine/main/.aurora/knowledge-index.json"
              }
            }
